name: Fast Semantic QA SSD HDD Real Media

on:
  push:
    branches:
      - video-build/ssd-hdd-explainer
    paths:
      - ".github/workflows/ssd-hdd-semantic-fast.yml"
      - "tools/ssd_hdd_video/patch_subject_tracking_v2.py"
      - "tools/ssd_hdd_video/patch_phrase_boundaries_v5.py"
      - "tools/ssd_hdd_video/patch_visual_semantics_v4.py"
      - "tools/ssd_hdd_video/patch_near_repeat_v6.py"
      - "tools/ssd_hdd_video/patch_semantic_specificity_v7.py"
      - "tools/ssd_hdd_video/patch_storyboard_only.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ssd-hdd-semantic-fast
  cancel-in-progress: true

jobs:
  semantic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download verified real assets
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-assets
          path: real_assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35807470144

      - name: Download supplemental real assets
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-assets-extra
          path: real_assets_extra
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35807748858

      - name: Merge assets
        run: |
          cp -a real_assets_extra/. real_assets/
          if [ -f real_assets/ATTRIBUTION_EXTRA.md ]; then
            printf "\n\n" >> real_assets/ATTRIBUTION.md
            cat real_assets/ATTRIBUTION_EXTRA.md >> real_assets/ATTRIBUTION.md
          fi

      - name: Download corrected narration timing
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-zundamon-narration
          path: voice
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35667383665

      - name: Install lightweight QA dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python3 -m pip install --disable-pip-version-check pillow janome

      - name: Apply semantic patches and storyboard-only mode
        run: |
          python3 tools/ssd_hdd_video/patch_subject_tracking_v2.py
          python3 tools/ssd_hdd_video/patch_phrase_boundaries_v5.py
          python3 tools/ssd_hdd_video/patch_visual_semantics_v4.py
          python3 tools/ssd_hdd_video/patch_storyboard_only.py
          python3 -m py_compile tools/ssd_hdd_video/render_real_media.py

      - name: Build complete 20-minute storyboard only
        env:
          SSD_HDD_STORYBOARD_ONLY: "1"
        run: |
          python3 tools/ssd_hdd_video/render_real_media.py

      - name: Strict full-video semantic QA
        run: |
          python3 - <<'PY'
          import csv
          from collections import Counter, defaultdict

          rows=list(csv.DictReader(open('real_video_output/storyboard.tsv',encoding='utf-8'),delimiter='\t'))
          assert len(rows) >= 250, len(rows)
          assert max(float(r['duration']) for r in rows) <= 4.05
          assert not any(rows[i]['asset']==rows[i-1]['asset'] for i in range(1,len(rows)))
          assert not any(rows[i]['asset'] in {x['asset'] for x in rows[max(0,i-2):i]} for i in range(len(rows)))
          assert 'zundamon_official' not in {r['asset'] for r in rows}
          assert len({r['asset'] for r in rows}) >= 14

          hdd_only={
              'hdd_working_video','hdd_open_photo','hdd_head_macro','laptop_hdd_open',
              'hdd_side','external_hdds','external_hdd_laptop','nas','nas_drive_bay','server_rack'
          }
          ssd_only={
              'sata_ssd','crucial_ssd','nvme_m2','laptop_nvme','m2_installed',
              'ssd_controller','ssd_nand','ssd_install'
          }
          hdd_mech={
              'hdd_working_video','hdd_open_photo','hdd_head_macro','laptop_hdd_open','hdd_side'
          }
          backup_media={
              'nas','nas_drive_bay','external_hdds','external_hdd_laptop','server_rack',
              'pc_m2_hdd_inside','hdd_ssd_disassembled'
          }
          strict_neutral={
              'hdd_ssd_disassembled','pc_m2_hdd_inside','motherboard','computer_components_video'
          }
          decision_keys=[
              '速度と容量','どちらを重視','どちらを優先','何を保存したい',
              '名前だけで判断','それぞれの特徴','特徴を理解','自分の用途',
              '用途に合った','選ぶこと','どっちを選ぶ','どちらが完全に上','どちらが上'
          ]
          mech_keys=['ヘッド','プラッタ','回ってくる','回転して','回転音','カリカリ','モーター','回転機構','機械部品']
          backup_keys=[
              'ストレージ一台だけ','SSDかHDDかを','バックアップに','別の場所','同じデータ',
              '3-2-1','合計3つ','2種類の保存先','一台が壊れても','データが残る状態',
              '本当に消したくない','重要なのは絶対に壊れない'
          ]

          errors=[]
          for r in rows:
              txt=r['text']; a=r['asset']; sec=r['section']
              if any(k in txt for k in ['バックアップ','大量に保存','大容量','保管','アーカイブ']):
                  if a in ssd_only:
                      errors.append(('archive/backup used active SSD-only media',r))
              if any(k in txt for k in ['全部SSD','SSDにする','SSD中心','SSDだけ']):
                  if a in hdd_only:
                      errors.append(('all-SSD clause used HDD-only media',r))
              if any(k in txt for k in ['HDDを多く','HDD中心','HDDを多め','多く使う構成']):
                  if a in ssd_only:
                      errors.append(('HDD-heavy clause used SSD-only media',r))
              if any(k in txt for k in decision_keys):
                  if a not in strict_neutral:
                      errors.append(('decision/conclusion clause used one-sided media',r))

              if sec in ('第2章　HDDとは？','第4章　SSDとHDDは何が違う？','第8章　寿命と故障はどう違う？'):
                  if any(k in txt for k in mech_keys) and a not in hdd_mech:
                      errors.append(('HDD mechanism phrase used non-HDD-mechanism media',r))

              if sec=='第9章　バックアップは必要':
                  deliberate_single=(
                      '高性能なSSD一台' in txt or '大容量HDD一台' in txt or
                      ('しかない動画' in txt and r.get('subject_hint') in ('SSD','HDD'))
                  )
                  if not deliberate_single and (any(k in txt for k in backup_keys) or 'バックアップ' in txt):
                      if a not in backup_media:
                          errors.append(('backup explanation used weak/non-backup media',r))

          assert not errors, errors[:30]

          by_section=defaultdict(list)
          for r in rows:
              if r['section']!='次回':
                  by_section[r['section']].append(r)
          for sec,rs in by_section.items():
              counts=Counter(r['asset'] for r in rs)
              assert len(counts) >= 5, (sec,'too few unique assets',counts)
              top,n=counts.most_common(1)[0]
              assert n/len(rs) <= 0.32, (sec,'asset overused',top,n/len(rs))

          mixed=[r for r in rows if 'Windowsやアプリ' in r.get('source_text','')]
          assert mixed, 'final mixed SSD/HDD sentence missing'
          assert any(r['text'].strip() in ('SSDへ置いて、','SSDへ置いて') for r in mixed), mixed
          assert not any('SSDへ置いて、写真' in r['text'] for r in mixed), mixed

          print('FAST_SEMANTIC_QA_OK',len(rows),'events',len({r['asset'] for r in rows}),'unique assets')
          print('max_hold',max(float(r['duration']) for r in rows))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-semantic-fast-qa
          path: |
            real_video_output/storyboard.tsv
            real_video_output/asset_usage.tsv
            real_video_output/subtitles_green.ass
          compression-level: 0
          retention-days: 7
