name: Build SSD HDD Explainer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow requests numpy soundfile

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              echo "VOICEVOX ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:50021/speakers | head -c 2000

      - name: Render animated full video
        run: |
          python3 tools/ssd_hdd_video/render_motion.py

      - name: Inspect output
        run: |
          ffprobe -v error -show_entries format=duration,size,bit_rate -of json output_motion/ssd_hdd_motion_complete.mp4
          ls -lah output_motion

      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-motion-video
          path: |
            output_motion/ssd_hdd_motion_complete.mp4
            output_motion/ssd_hdd_motion_preview.mp4
            output_motion/subtitles.srt
            output_motion/narration.wav
            output_motion/chapters.txt
          compression-level: 0
          retention-days: 7
