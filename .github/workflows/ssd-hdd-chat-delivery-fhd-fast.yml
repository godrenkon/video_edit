name: SSD HDD Chat Delivery FHD Fast 60fps

on:
  push:
    branches:
      - video-build/ssd-hdd-explainer
    paths:
      - ".github/workflows/ssd-hdd-chat-delivery-fhd-fast.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  encode:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download completed V15 master
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-media-v15-final
          path: source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37008200714

      - name: Encode FHD 60fps delivery copy
        run: |
          set -euo pipefail
          mkdir -p delivery

          INPUT="source/SSD_HDD_REAL_MEDIA_V15_FINAL.mp4"
          OUTPUT="delivery/SSD_HDD_REAL_MEDIA_V15_FHD_60FPS_CHAT.mp4"
          PROBE="delivery/ffprobe.json"

          ffmpeg -y -hide_banner -loglevel warning \
            -i "$INPUT" \
            -map 0:v:0 -map 0:a:0 \
            -vf "scale=1920:1080:flags=lanczos,fps=60" \
            -c:v libx264 -preset veryfast \
            -b:v 2900k -maxrate 3400k -bufsize 6800k \
            -pix_fmt yuv420p \
            -c:a aac -b:a 160k -ar 48000 \
            -movflags +faststart \
            "$OUTPUT"

          ffprobe -v error \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels \
            -show_entries format=duration,size,bit_rate \
            -of json "$OUTPUT" > "$PROBE"
          cat "$PROBE"

          python3 - <<'PY'
          import json
          from fractions import Fraction

          with open("delivery/ffprobe.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          video = next(s for s in data["streams"] if s.get("codec_type") == "video")
          audio = next(s for s in data["streams"] if s.get("codec_type") == "audio")
          fmt = data["format"]

          assert video.get("codec_name") == "h264", video
          assert video.get("width") == 1920 and video.get("height") == 1080, video
          assert Fraction(video.get("r_frame_rate", "0/1")) == Fraction(60, 1), video
          assert audio.get("codec_name") == "aac", audio
          assert int(audio.get("sample_rate", 0)) == 48000, audio
          assert int(audio.get("channels", 0)) == 2, audio
          assert float(fmt.get("duration", 0)) > 1100.0, fmt
          assert int(fmt.get("size", 0)) < 500_000_000, fmt

          print("DELIVERY_QA_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-fhd-60fps-chat-delivery
          path: |
            delivery/SSD_HDD_REAL_MEDIA_V15_FHD_60FPS_CHAT.mp4
            delivery/ffprobe.json
          compression-level: 0
          retention-days: 7
