name: SSD HDD Real Media V13 Zundamon Smoke

on:
  push:
    branches:
      - video-build/ssd-hdd-explainer
    paths:
      - ".github/workflows/ssd-hdd-real-media-v13-zundamon-smoke.yml"
      - "tools/ssd_hdd_video/build_zundamon_23_poses.py"
      - "tools/ssd_hdd_video/patch_v13_real_zundamon_poses.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ssd-hdd-real-media-v13-zundamon-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Download verified real assets
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-assets
          path: real_assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36679624503

      - name: Download supplemental real assets
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-assets-extra
          path: real_assets_extra
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36679063835

      - name: Merge supplemental assets
        run: |
          cp -a real_assets_extra/. real_assets/
          if [ -f real_assets/ATTRIBUTION_EXTRA.md ]; then
            cat real_assets/ATTRIBUTION_EXTRA.md >> real_assets/ATTRIBUTION.md
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow janome requests numpy soundfile

      - name: Build genuine Zundamon 2.3 poses
        run: |
          rm -rf zundamon_poses
          python3 tools/ssd_hdd_video/build_zundamon_23_poses.py
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from PIL import Image
          m=json.load(open('zundamon_poses/manifest.json',encoding='utf-8'))
          poses=m['poses']
          assert len(poses)==4, len(poses)
          assert len({x['sha256'] for x in poses})==4
          for x in poses:
              p=Path('zundamon_poses')/x['file']
              im=Image.open(p).convert('RGBA')
              assert im.getchannel('A').getbbox(), p
              assert im.height>=800 and im.width>=300, (p,im.size)
          print('V13_POSE_BUILD_OK',[(x['name'],x['size'],x['sha256'][:12]) for x in poses])
          PY

      - name: Pronunciation source QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('tools/ssd_hdd_video/build_voice_only.py').read_text(encoding='utf-8')
          checks={'HDD':'エイチディーディー','SSD':'エスエスディー','NVMe':'エヌブイエムイー','M.2':'エムドットツー'}
          for src,dst in checks.items():
              assert src in s and dst in s,(src,dst)
          print('PRONUNCIATION_SOURCE_QA_OK',checks)
          PY

      - name: Start VOICEVOX
        run: |
          docker pull voicevox/voicevox_engine:cpu-latest
          docker run -d --rm --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then
              echo "VOICEVOX ready"
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Build corrected narration and timings
        run: |
          rm -rf voice voice_output
          python3 tools/ssd_hdd_video/build_voice_only.py
          mkdir -p voice
          cp voice_output/SSD_HDD_NARRATION_ZUNDAMON_48k.wav voice/
          cp voice_output/narration_timestamps.tsv voice/

      - name: Apply V12 precision patches and V13 real Zundamon poses
        run: |
          python3 tools/ssd_hdd_video/patch_subject_tracking_v2.py
          python3 tools/ssd_hdd_video/patch_phrase_boundaries_v5.py
          python3 tools/ssd_hdd_video/patch_visual_semantics_v4.py
          python3 tools/ssd_hdd_video/patch_v82_visuals.py
          # V13: DO NOT run patch_v82_zundamon_variants.py. It mirrored/tilted one still.
          python3 tools/ssd_hdd_video/patch_v13_real_zundamon_poses.py
          python3 tools/ssd_hdd_video/patch_v9_precision.py
          python3 tools/ssd_hdd_video/patch_near_repeat_v6.py
          python3 tools/ssd_hdd_video/patch_smoke_boundary_v12.py
          python3 -m py_compile tools/ssd_hdd_video/render_real_media.py
          grep -n "genuine Zundamon\|choose_zundamon_pose\|zundamon_poses" tools/ssd_hdd_video/render_real_media.py | head -n 40

      - name: Smoke intro and mechanism section
        env:
          SSD_HDD_SMOKE_START: "0"
          SSD_HDD_SMOKE_SECONDS: "85"
        run: |
          rm -rf real_video_output /tmp/ssd_hdd_real_render
          python3 tools/ssd_hdd_video/render_real_media.py
          mv real_video_output smoke_intro
          test "$(cat smoke_intro/zundamon_pose_count.txt)" = "4"

      - name: Smoke comparison question section
        env:
          SSD_HDD_SMOKE_START: "420"
          SSD_HDD_SMOKE_SECONDS: "55"
        run: |
          rm -rf real_video_output /tmp/ssd_hdd_real_render
          python3 tools/ssd_hdd_video/render_real_media.py
          mv real_video_output smoke_question
          test "$(cat smoke_question/zundamon_pose_count.txt)" = "4"

      - name: Smoke lifetime and backup attention section
        env:
          SSD_HDD_SMOKE_START: "865"
          SSD_HDD_SMOKE_SECONDS: "65"
        run: |
          rm -rf real_video_output /tmp/ssd_hdd_real_render
          python3 tools/ssd_hdd_video/render_real_media.py
          mv real_video_output smoke_attention
          test "$(cat smoke_attention/zundamon_pose_count.txt)" = "4"

      - name: Build V13 pose QA package
        run: |
          mkdir -p qa/poses qa/frames
          cp zundamon_poses/*.png qa/poses/
          cp zundamon_poses/manifest.json qa/poses/
          cp smoke_intro/storyboard.tsv qa/storyboard_intro.tsv
          cp smoke_question/storyboard.tsv qa/storyboard_question.tsv
          cp smoke_attention/storyboard.tsv qa/storyboard_attention.tsv
          cp smoke_intro/zundamon_pose_manifest.json qa/
          cp real_assets/ATTRIBUTION.md qa/ATTRIBUTION.md
          cat >> qa/ATTRIBUTION.md <<'EOF'

          - **Zundamon standing-art poses** — 坂本アヒル — original material: 「ずんだもん立ち絵素材2.3」 (im10788496). V13 composites distinct original v2.3 layers; no AI-generated character art, no mirror/tilt fake poses. Build-time expanded-layer mirror: Winnako155/Zundamon-Sprite-Editor, pinned commit 3907b8331962b4694c5be73ad36aebaefb7337ea. Character usage follows the 東北ずん子・ずんだもん project guidelines.
          - **Voice** — VOICEVOX:ずんだもん
          EOF
          for SPEC in "intro smoke_intro 12 34 62" "question smoke_question 8 26 44" "attention smoke_attention 8 30 52"; do
            set -- $SPEC
            NAME=$1; DIR=$2; shift 2
            for T in "$@"; do
              ffmpeg -y -loglevel error -ss "$T" -i "$DIR/SSD_HDD_REAL_MEDIA_FINAL.mp4" -frames:v 1 "qa/frames/${NAME}_${T}.png"
            done
            ffmpeg -y -loglevel error -i "$DIR/SSD_HDD_REAL_MEDIA_FINAL.mp4" -vf scale=1280:720 -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 160k "qa/${NAME}.mp4"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-v13-zundamon-smoke-qa
          path: qa
          compression-level: 0
          retention-days: 7
