name: Smoke Test SSD HDD Real-Media V8.2

on:
  push:
    branches:
      - video-build/ssd-hdd-explainer
    paths:
      - ".github/workflows/ssd-hdd-real-media-v82-smoke.yml"
      - "tools/ssd_hdd_video/patch_v82_visuals.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download verified real assets
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-assets
          path: real_assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35807470144

      - name: Download supplemental real assets
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-assets-extra
          path: real_assets_extra
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35807748858

      - name: Merge supplemental real assets
        run: |
          cp -a real_assets_extra/. real_assets/
          if [ -f real_assets/ATTRIBUTION_EXTRA.md ]; then
            cat real_assets/ATTRIBUTION_EXTRA.md >> real_assets/ATTRIBUTION.md
          fi

      - name: Download corrected Zundamon narration
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-zundamon-narration
          path: voice
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35667383665

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow janome

      - name: Apply V8.2 patches
        run: |
          python3 tools/ssd_hdd_video/patch_subject_tracking_v2.py
          python3 tools/ssd_hdd_video/patch_phrase_boundaries_v5.py
          python3 tools/ssd_hdd_video/patch_visual_semantics_v4.py
          python3 tools/ssd_hdd_video/patch_v82_visuals.py
          python3 -m py_compile tools/ssd_hdd_video/render_real_media.py

      - name: Render targeted smoke windows
        run: |
          mkdir -p v82_smoke
          for SPEC in "0 35 opening" "390.026 35 speed" "620.117 35 types" "900.008 35 backup"; do
            set -- $SPEC
            START=$1
            LEN=$2
            NAME=$3
            rm -rf real_video_output /tmp/ssd_hdd_real_render
            mkdir -p real_video_output
            SSD_HDD_SMOKE_START=$START SSD_HDD_SMOKE_SECONDS=$LEN python3 tools/ssd_hdd_video/render_real_media.py
            cp real_video_output/SSD_HDD_REAL_MEDIA_FINAL.mp4 "v82_smoke/${NAME}.mp4"
            cp real_video_output/storyboard.tsv "v82_smoke/${NAME}_storyboard.tsv"
            cp real_video_output/subtitles_green.ass "v82_smoke/${NAME}_subtitles.ass"
            cp real_video_output/zundamon_pose_count.txt "v82_smoke/${NAME}_pose_count.txt"
            ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "v82_smoke/${NAME}.mp4"
          done

      - name: Hard smoke QA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv
          root=Path('v82_smoke')
          for name in ['opening','speed','types','backup']:
              pose_count=int((root/f'{name}_pose_count.txt').read_text().strip())
              assert pose_count >= 2, (name,'expected multiple official Zundamon poses',pose_count)
              rows=list(csv.DictReader(open(root/f'{name}_storyboard.tsv',encoding='utf-8'),delimiter='\t'))
              assert len(rows) >= 8, (name,len(rows))
              durs=[float(r['duration']) for r in rows]
              assert max(durs) <= 4.05, (name,max(durs))
              assert not any(rows[i]['asset']==rows[i-1]['asset'] for i in range(1,len(rows))), (name,'adjacent duplicate')
          print('V8.2_SMOKE_QA_OK')
          PY

      - name: Extract contact frames
        run: |
          mkdir -p v82_smoke/frames
          for NAME in opening speed types backup; do
            for T in 5 12 20 28; do
              ffmpeg -y -loglevel error -ss "$T" -i "v82_smoke/${NAME}.mp4" -frames:v 1 "v82_smoke/frames/${NAME}_${T}.png"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-v82-smoke
          path: v82_smoke
          compression-level: 0
          retention-days: 7
