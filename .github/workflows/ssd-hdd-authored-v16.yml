name: SSD HDD V16 Authored
on:
  push:
    branches: [video-build/ssd-hdd-explainer]
    paths: [.github/workflows/ssd-hdd-authored-v16.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python3 -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-assets
          path: real_assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36679624503
      - uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-assets-extra
          path: real_assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36995725158
      - uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-zundamon-narration
          path: voice
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36995762480
      - uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-media-v15-qa
          path: v15_qa
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37008200714
      - name: Restore verified subtitles and poses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('v15_qa')
          Path('zundamon_poses').mkdir(exist_ok=True)
          source=next(root.rglob('subtitles_green_v15.ass'))
          shutil.copyfile(source,'voice/subtitles_source.ass')
          for pose in ['normal','explain','question','attention']:
              candidates=list(root.rglob('zundamon_'+pose+'.png'))
              if not candidates:
                  candidates=list(root.rglob(pose+'.png'))
              if len(candidates)!=1:
                  raise RuntimeError((pose,candidates))
              shutil.copyfile(candidates[0],'zundamon_poses/zundamon_'+pose+'.png')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-v16-editing-inputs
          path: |
            real_assets/
            voice/SSD_HDD_NARRATION_ZUNDAMON_48k.wav
            voice/narration_timestamps.tsv
            voice/subtitles_source.ass
            zundamon_poses/
          retention-days: 90
      - name: Verify and render authored video
        run: |
          set -euo pipefail
          python3 tools/ssd_hdd_video/test_authored.py
          python3 tools/ssd_hdd_video/render_authored.py --assets real_assets --voice voice --poses zundamon_poses --out v16_output
          ffmpeg -v error -xerror -threads 2 -i v16_output/SSD_HDD_V16_FHD_60FPS.mp4 -map 0:v:0 -map 0:a:0 -f null -
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('v16_output')
          data=json.loads((root/'ffprobe.json').read_text())
          video=next(s for s in data['streams'] if s['codec_type']=='video')
          assert int(video['nb_frames'])==72068
          for sec in [5,200,520,655,805,955,1100,1195]:
              subprocess.run(['ffmpeg','-y','-v','error','-ss',str(sec),'-i',str(root/'SSD_HDD_V16_FHD_60FPS.mp4'),'-frames:v','1',str(root/f'frame_{sec}.png')],check=True)
          (root/'QA_PASS.txt').write_text('Full decode PASS. 72068 frames, 1920x1080, 60fps, 48kHz stereo.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-v16-final
          path: |
            v16_output/SSD_HDD_V16_FHD_60FPS.mp4
            v16_output/ATTRIBUTION.md
            v16_output/ffprobe.json
            v16_output/QA_PASS.txt
            v16_output/storyboard.tsv
            v16_output/subtitles_v16.ass
            v16_output/frame_*.png
          retention-days: 90
          compression-level: 0
