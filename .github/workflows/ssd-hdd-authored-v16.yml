name: SSD HDD V16 Authored
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Run containing ssd-hdd-v16-editing-inputs
        required: true
        default: '37308946171'
        type: string
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python3 -m pip install Pillow
      - uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-v16-editing-inputs
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-v16-editing-inputs
          path: |
            real_assets/
            voice/SSD_HDD_NARRATION_ZUNDAMON_48k.wav
            voice/narration_timestamps.tsv
            voice/subtitles_source.ass
            zundamon_poses/
          retention-days: 90
      - name: Verify and render authored video
        run: |
          set -euo pipefail
          python3 tools/ssd_hdd_video/test_authored.py
          python3 tools/ssd_hdd_video/render_authored.py --assets real_assets --voice voice --poses zundamon_poses --out v16_output
          ffmpeg -v error -xerror -threads 2 -i v16_output/SSD_HDD_V16_FHD_60FPS.mp4 -map 0:v:0 -map 0:a:0 -f null -
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          root=Path('v16_output')
          data=json.loads((root/'ffprobe.json').read_text())
          video=next(s for s in data['streams'] if s['codec_type']=='video')
          assert int(video['nb_frames'])==72068
          for sec in [5,200,520,655,805,955,1100,1195]:
              subprocess.run(['ffmpeg','-y','-v','error','-ss',str(sec),'-i',str(root/'SSD_HDD_V16_FHD_60FPS.mp4'),'-frames:v','1',str(root/f'frame_{sec}.png')],check=True)
          (root/'QA_PASS.txt').write_text('Full decode PASS. 72068 frames, 1920x1080, 60fps, 48kHz stereo.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-v16-final
          path: |
            v16_output/SSD_HDD_V16_FHD_60FPS.mp4
            v16_output/ATTRIBUTION.md
            v16_output/ffprobe.json
            v16_output/QA_PASS.txt
            v16_output/storyboard.tsv
            v16_output/subtitles_v16.ass
            v16_output/frame_*.png
          retention-days: 90
          compression-level: 0
