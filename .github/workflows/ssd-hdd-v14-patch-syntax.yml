name: SSD HDD V14 Patch Syntax QA

on:
  push:
    branches:
      - video-build/ssd-hdd-explainer
    paths:
      - ".github/workflows/ssd-hdd-v14-patch-syntax.yml"
      - "tools/ssd_hdd_video/patch_v14_semantic_storytelling.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply production patch chain
        run: |
          python3 tools/ssd_hdd_video/patch_subject_tracking_v2.py
          python3 tools/ssd_hdd_video/patch_phrase_boundaries_v5.py
          python3 tools/ssd_hdd_video/patch_visual_semantics_v4.py
          python3 tools/ssd_hdd_video/patch_v82_visuals.py
          python3 tools/ssd_hdd_video/patch_v13_real_zundamon_poses.py
          python3 tools/ssd_hdd_video/patch_v9_precision.py
          python3 tools/ssd_hdd_video/patch_near_repeat_v6.py
          python3 tools/ssd_hdd_video/patch_smoke_boundary_v12.py
          python3 tools/ssd_hdd_video/patch_v14_semantic_storytelling.py
          python3 -m py_compile tools/ssd_hdd_video/render_real_media.py
      - name: Verify V14 markers
        run: |
          grep -n "reset at EVERY narration sentence" tools/ssd_hdd_video/render_real_media.py
          grep -n "RAM / memory explanation" tools/ssd_hdd_video/render_real_media.py
          grep -n "Browser / application / Windows" tools/ssd_hdd_video/render_real_media.py
          grep -n "Backup chapter" tools/ssd_hdd_video/render_real_media.py
          if grep -q "running_subject_hint" tools/ssd_hdd_video/render_real_media.py; then
            echo "cross-sentence running_subject_hint still present" >&2
            exit 1
          fi
          echo "V14_PATCH_SYNTAX_QA_OK"
