name: Build Full Real-Media SSD HDD Video

on:
  push:
    branches:
      - video-build/ssd-hdd-explainer
    paths:
      - "tools/ssd_hdd_video/FULL_RENDER_TRIGGER.txt"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ssd-hdd-real-media-full
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Download verified real assets
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-assets
          path: real_assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35807470144

      - name: Download supplemental real assets
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-real-assets-extra
          path: real_assets_extra
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35807748858

      - name: Merge supplemental real assets
        run: |
          cp -a real_assets_extra/. real_assets/
          if [ -f real_assets/ATTRIBUTION_EXTRA.md ]; then
            cat real_assets/ATTRIBUTION_EXTRA.md >> real_assets/ATTRIBUTION.md
          fi


      - name: Download corrected Zundamon narration
        uses: actions/download-artifact@v4
        with:
          name: ssd-hdd-zundamon-narration
          path: voice
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 35667383665

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow janome

      - name: Render full real-media explainer
        run: |
          python3 -m py_compile tools/ssd_hdd_video/render_real_media.py
          python3 tools/ssd_hdd_video/render_real_media.py

      - name: Hard QA
        run: |
          ffprobe -v error -show_streams -show_format -of json real_video_output/SSD_HDD_REAL_MEDIA_FINAL.mp4 > real_video_output/ffprobe.json
          python3 - <<'PY'
          import csv, json, re
          rows=list(csv.DictReader(open("real_video_output/storyboard.tsv",encoding="utf-8"),delimiter="\t"))
          assert rows, "empty storyboard"
          durations=[float(r["duration"]) for r in rows]
          assets={r["asset"] for r in rows}
          assert max(durations) <= 4.05, max(durations)
          assert "zundamon_official" not in assets, "Zundamon used as background media"
          assert len(assets) >= 14, len(assets)
          assert len(rows) >= 250, len(rows)

          # Per-chapter media diversity QA: do not let the video fall back into
          # long stretches of the same few assets even when every individual
          # shot is short.
          from collections import Counter, defaultdict
          by_section=defaultdict(list)
          for r in rows:
              by_section[r["section"]].append(r)
          for section, rs in by_section.items():
              if section=="次回":
                  continue
              counts=Counter(r["asset"] for r in rs)
              assert len(counts) >= 6, (section, "too few unique assets", counts)
              top_asset, top_count = counts.most_common(1)[0]
              top_share = top_count / len(rs)
              assert top_share <= 0.30, (section, "asset overused", top_asset, top_share)

          probe=json.load(open("real_video_output/ffprobe.json"))
          fmt=probe["format"]
          assert float(fmt["duration"]) > 1100, fmt["duration"]
          video=next(x for x in probe["streams"] if x["codec_type"]=="video")
          audio=next(x for x in probe["streams"] if x["codec_type"]=="audio")
          assert video["width"]==1920 and video["height"]==1080
          assert video["r_frame_rate"]=="60/1"
          assert audio["sample_rate"]=="48000"
          assert audio["channels"]==2, audio.get("channels")
          ass=open("real_video_output/subtitles_green.ass",encoding="utf-8-sig").read().splitlines()
          cues=[]
          for line in ass:
              if not line.startswith("Dialogue:"): continue
              txt=line.split(",,",1)[-1]
              txt=re.sub(r"\{[^}]+\}","",txt).replace("\\N"," ").strip()
              cues.append(txt)
          assert cues, "no subtitles"
          bad=[x for x in cues if x.startswith(("、","。","，",",","：",":","；",";","！","？","!","?"))]
          assert not bad, "leading punctuation in subtitle: "+repr(bad[:10])
          assert max(map(len,cues)) <= 33, max(map(len,cues))
          import os
          assert os.path.getsize("real_video_output/sfx_stem.wav") > 1000, "sfx_stem.wav"
          print("events",len(rows),"unique_assets",len(assets),"max_hold",max(durations),"duration",fmt["duration"],"subtitle_cues",len(cues),"subtitle_max",max(map(len,cues)))
          print("assets",sorted(assets))
          PY

      - name: Build upload credits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("real_video_output/ATTRIBUTION.md")
          out=Path("real_video_output/YOUTUBE_DESCRIPTION_CREDITS.txt")
          lines=[
            "【使用素材・BGM・SE】",
            "この動画では、以下のライセンスに基づく素材を使用しています。",
            "",
          ]
          if src.exists():
              for raw in src.read_text(encoding="utf-8").splitlines():
                  s=raw.strip()
                  if not s.startswith("- **"):
                      continue
                  # Markdown bold only removed; source URLs/licence/author remain intact.
                  lines.append(s.replace("**",""))
          lines += [
            "",
            "VOICEVOX:ずんだもん",
            "ずんだもん立ち絵: VOICEVOX / ずんずんPJ の利用条件に基づき使用",
          ]
          out.write_text("\n".join(lines)+"\n",encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Build QA samples
        run: |
          mkdir -p qa
          cp real_video_output/storyboard.tsv qa/
          cp real_video_output/ffprobe.json qa/
          cp real_video_output/ATTRIBUTION.md qa/
          cp real_video_output/subtitles_green.ass qa/
          for T in 15 90 180 300 420 540 660 780 900 1020 1140; do
            cp "real_video_output/frame_${T}.png" qa/
          done
          ffmpeg -y -loglevel error -ss 0 -i real_video_output/SSD_HDD_REAL_MEDIA_FINAL.mp4 -t 35 -vf scale=1280:720 -c:v libx264 -crf 21 -preset veryfast -c:a aac -b:a 160k qa/opening_35s.mp4
          ffmpeg -y -loglevel error -ss 180 -i real_video_output/SSD_HDD_REAL_MEDIA_FINAL.mp4 -t 25 -vf scale=1280:720 -c:v libx264 -crf 21 -preset veryfast -c:a aac -b:a 160k qa/hdd_25s.mp4
          ffmpeg -y -loglevel error -ss 390 -i real_video_output/SSD_HDD_REAL_MEDIA_FINAL.mp4 -t 25 -vf scale=1280:720 -c:v libx264 -crf 21 -preset veryfast -c:a aac -b:a 160k qa/speed_25s.mp4
          ffmpeg -y -loglevel error -ss 620 -i real_video_output/SSD_HDD_REAL_MEDIA_FINAL.mp4 -t 25 -vf scale=1280:720 -c:v libx264 -crf 21 -preset veryfast -c:a aac -b:a 160k qa/types_25s.mp4
          ffmpeg -y -loglevel error -ss 900 -i real_video_output/SSD_HDD_REAL_MEDIA_FINAL.mp4 -t 25 -vf scale=1280:720 -c:v libx264 -crf 21 -preset veryfast -c:a aac -b:a 160k qa/backup_25s.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-real-media-final
          path: |
            real_video_output/SSD_HDD_REAL_MEDIA_FINAL.mp4
            real_video_output/SSD_HDD_REAL_MEDIA_CLEAN.mp4
            real_video_output/SSD_HDD_REAL_MEDIA_PREVIEW_720p.mp4
            real_video_output/bgm_stem.wav
            real_video_output/sfx_stem.wav
            real_video_output/storyboard.tsv
            real_video_output/subtitles_green.ass
            real_video_output/ATTRIBUTION.md
            real_video_output/YOUTUBE_DESCRIPTION_CREDITS.txt
            real_video_output/ffprobe.json
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: ssd-hdd-real-media-qa
          path: qa
          compression-level: 0
          retention-days: 7
